name: Check Pinned Actions

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "main"
permissions:
  contents: read

jobs:
  check-pinned-actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check GitHub Actions are pinned to commit hashes
        uses: suzuki-shunsuke/pinact-action@b1a1f46bb10f2908950d95f626ca8cc109e2cf7d # v3.1.0
        with:
          fix: "false"
          verify: "true"
          min_age: "3"
          verify_min_age: "true"
